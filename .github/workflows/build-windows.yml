name: Windows EXE Build (PyInstaller - minimal)

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (diagnostic)
        shell: pwsh
        run: |
          Write-Host "Repository tree:"
          Get-ChildItem -Recurse -Force | Select-Object FullName

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          # ✅ 必须：安装 PyInstaller（构建工具）
          python -m pip install pyinstaller

          # ✅ 你的脚本依赖：pywin32
          python -m pip install pywin32

          # 可选：打印版本，确认安装成功
          python -m PyInstaller --version

          # 可选：提前验证关键模块是否能 import
          python -c "import win32com.client; print('win32com ok')"
          python -c "import win32timezone; print('win32timezone ok')"

      - name: Build EXE (entry script)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

          if (!(Test-Path "src/for_lab.py")) {
            Write-Error "Entry script not found: src/for_lab.py"
            exit 1
          }

          # ✅ 用 python -m PyInstaller，避免 PATH 找不到 pyinstaller 命令
          python -m PyInstaller --clean --onefile --console --name app.exe `
            --workpath build --distpath dist `
            --hidden-import win32timezone `
            src/for_lab.py

          Write-Host "Dist contents:"
          Get-ChildItem -Force dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
