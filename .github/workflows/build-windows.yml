name: Windows EXE Build (PyInstaller)

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (including PyMuPDF)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          # Install repo requirements if present
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          # Ensure build tool & runtime deps exist in CI environment
          python -m pip install --upgrade pyinstaller pywin32 pymupdf

          # Avoid wrong "fitz" package conflict; then force reinstall pymupdf
          # (PyMuPDF docs note this common issue and remediation)
          pip uninstall -y fitz | Out-Null
          python -m pip install --force-reinstall pymupdf

          # Verify critical imports before packaging
          python -c "import win32com.client; print('win32com ok')"
          python -c "import win32timezone; print('win32timezone ok')"
          python -c "import pymupdf; print('pymupdf ok', pymupdf.__version__)"
          python -c "import fitz; print('fitz ok')"

          python -m PyInstaller --version

      - name: Build EXE (via spec)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

          if (!(Test-Path "src/for_lab.py")) {
            Write-Error "Entry script not found: src/for_lab.py"
            exit 1
          }

          if (!(Test-Path "pyinstaller.spec")) {
            Write-Error "Spec file not found: pyinstaller.spec"
            exit 1
          }

          # Build using spec file (spec drives hiddenimports/binaries/datas collection)
          python -m PyInstaller --clean --noconfirm pyinstaller.spec

          Write-Host "Dist contents:"
          Get-ChildItem -Force dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
