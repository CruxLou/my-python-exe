name: Windows EXE Build (PyInstaller - minimal)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (diagnostic)
        shell: pwsh
        run: |
          Write-Host "Repository tree:"
          Get-ChildItem -Recurse | Select-Object FullName

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          # 保险起见：明确安装 pywin32
          python -m pip install pywin32

      - name: Build EXE (entry script)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          # 关键：入口脚本必须存在，先检查
          
if (!(Test-Path "src/main.py")) {
            Write-Error "Entry script not found: src/main.py"
            exit 1
          }

          pyinstaller --clean --onefile --console --name app.exe `
            --workpath build --distpath dist `
            --hidden-import win32timezone `
            src/main.py
 --hidden-import win32timezone
          Write-Host "Dist contents:"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist

  # 可选：打 tag 自动创建 Release 并附加 exe
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
