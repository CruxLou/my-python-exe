name: Windows EXE Build (PyInstaller)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # 可选：带 tag 自动发布
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if exist requirements.txt (
            python -m pip install -r requirements.txt
          )
          python -m pip install pyinstaller

      - name: Build (PyInstaller via spec)  # 如果你采用方案 A
        if: ${{ hashFiles('pyinstaller.spec') != '' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller --clean --onefile --console --name app.exe --specpath . --workpath build --distpath dist pyinstaller.spec

      - name: Build (PyInstaller via entry) # 如果你采用方案 B
        if: ${{ hashFiles('pyinstaller.spec') == '' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          # 保留空格路径时请用引号：
          pyinstaller --clean --onefile --console --name app.exe --workpath build --distpath dist "src/for lab/main.py"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist

  # 可选：打 tag 自动创建 Release 并附加 exe
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
